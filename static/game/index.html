<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#050b14"><title>微光归途</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="minimal.css"><link rel="stylesheet" href="courtyard.css"></head>
<body>
<main id="app">
  <canvas id="world" aria-label="物理解谜游戏画布"></canvas>
  <div class="grain"></div><div class="interface-grid"></div><div class="scanline"></div>
  <header class="brand"><a id="home" href="#" aria-label="返回主菜单"><span class="brand-icon"><i></i></span><span>微光归途<small>物理解谜</small></span></a><span class="edition"><i></i> 观察 · 构筑 · 释放</span></header>
  <section id="menu" class="screen">
    <div class="menu-copy"><p class="eyebrow"><i></i> 一条路，一种新的可能</p><h1>微光<span>归途<span class="title-dot">.</span></span></h1><p class="subtitle">构筑一条路，让微光找到归途。</p><div class="menu-actions"><button id="start" class="primary fluid"><small>开始新的旅程</small>开始旅程 <span>↗</span></button><button id="continue" class="secondary hidden"><small>返回最近的关卡</small>继续旅程 <span>→</span></button></div><div class="menu-links"><button data-open="settings">偏好设置</button><span>/</span><button data-open="about">关于空间</button></div></div>
    <div class="energy-core" aria-hidden="true"><div class="core-orbit orbit-a"><i></i></div><div class="core-orbit orbit-b"><i></i></div><div class="core-ring"></div><div class="core-center"><i></i></div><span class="core-label">重力核心<br><small>场域稳定 · 98.7%</small></span></div>
    <div class="scene-caption"><span class="small-cross">+</span><span>01 — 引力之间<br><small>搭建、释放，找到新的平衡。</small></span></div><footer class="menu-footer"><span><i></i> 本地演算 · 离线运行</span><span>微光归途 <b>版本 0.3</b></span></footer>
  </section>
  <section id="select" class="screen hidden"><div class="section-heading"><div><p class="eyebrow"><i></i> 关卡档案</p><h2>选择关卡</h2><p>从第一道斜坡开始，学习搭建与释放。</p></div><div class="scroll-readout" aria-live="polite"><span id="active-node">关卡 01</span><div class="readout-track"><i id="readout-progress"></i></div><small>随滚动定位关卡</small></div></div><div id="level-list"></div><footer class="selection-footer"><span id="total-stars"></span><span>21 关 · 13 枚碎片 · 观察与规划</span></footer></section>
  <section id="play" class="screen hidden">
    <div class="hud"><button id="back-to-levels" class="back-button" aria-label="返回选关"><span aria-hidden="true">←</span> 返回</button><button id="pause" class="icon-button" aria-label="暂停">Ⅱ</button><div class="hud-title"><span id="chapter-label"></span><h3 id="level-name"></h3></div><div class="hud-stats"><span id="goal-label">◉ 0 / 1</span><span id="timer">00:00</span><button id="reset" class="icon-button" aria-label="重新开始">↻</button></div></div>
    <div class="tutorial"><span id="step-num">01</span><div><small id="step-title">当前目标</small><p id="instruction"></p></div><button id="hint" aria-label="重看操作指引">?</button></div>
    <div id="lesson-progress" class="lesson-strip hidden" aria-label="教学进度" aria-live="polite"></div>
    <div class="tools"><button id="tool-move" class="active">↗ <span>摆放</span></button><button id="tool-board">▰ <span>木板</span><small id="boards">0</small></button><button id="tool-line">〰 <span>画线</span><small id="lines">0</small></button><button id="undo" aria-label="撤销">↶</button><button id="clear" aria-label="清理">⌫</button><button id="rotate-board" aria-label="旋转木板15度">⤾</button><label id="angle-wrap" class="hidden"><input id="board-angle" type="range" min="-60" max="60" step="1" value="0" aria-label="木板角度"><span id="angle-label">0°</span></label><div id="scale-tools" class="hidden"><button id="smaller" aria-label="缩小">−</button><span id="scale-label">1.00×</span><button id="larger" aria-label="放大">+</button></div></div>
    <div id="device-choices" class="device-choices hidden" aria-label="机关配置"></div><div class="phase-controls"><span id="phase-label">准备 · 重力向下 ↓</span><button id="release" class="primary">释放 <span>▷</span></button><button id="prepare" class="secondary hidden">返回准备</button></div>
  </section>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modal-content"></div></div>
  <div id="level-detail" class="level-detail hidden" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="detail-backdrop"></div><section class="detail-sheet"><button class="detail-handle" aria-label="拖动调整详情面板高度"><i></i></button><div id="detail-content"></div></section></div>
  <div id="chain-progress" class="hidden"></div><div id="debug-panel" class="hidden"></div><div id="toast" role="status"></div>
  <section id="courtyard" hidden aria-label="回环之庭"></section><div id="rotate"><span>↻</span><h2>把世界横过来</h2><p>横屏，才能看见完整的空间。</p></div>
</main>
<script src="vendor/matter.min.js"></script><script src="js/physics.js"></script><script src="js/core.js"></script><script src="js/levels.js"></script><script src="js/runtime.js"></script><script src="js/session.js"></script><script src="js/platform.js"></script><script src="js/renderer.js"></script><script src="js/interactions.js"></script><script src="js/music.js"></script><script src="js/courtyard.js"></script><script src="js/courtyard-renderer.js"></script><script src="js/courtyard-view.js"></script><script src="js/game.js"></script>
</body></html>
