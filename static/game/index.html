<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#101f25"><title>失衡空间 · Gravity Shift</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="app">
  <canvas id="world" aria-label="物理解谜游戏画布"></canvas>
  <div class="grain"></div>
  <header class="brand"><a id="home" href="#" aria-label="返回主菜单"><span class="brand-icon">◈</span> GRAVITY SHIFT</a><span class="edition">物理解谜实验 / VOL. 01</span></header>
  <section id="menu" class="screen">
    <div class="menu-copy"><p class="eyebrow"><i></i> A LITTLE SHIFT. A NEW POSSIBILITY.</p><h1>失衡<span>空间<span class="title-dot">.</span></span></h1><p class="subtitle">构筑一条路，让微光找到归途。</p><div class="menu-actions"><button id="start" class="primary">开始旅程 <span>↗</span></button><button id="continue" class="secondary hidden">继续旅程 <span>→</span></button></div><div class="menu-links"><button data-open="settings">偏好设置</button><span>/</span><button data-open="about">关于空间</button></div></div>
    <div class="scene-caption"><span class="small-cross">+</span><span>01 — 引力之间<br><small>搭建、释放，找到新的平衡。</small></span></div><footer class="menu-footer"><span>观察 · 构筑 · 释放</span><span>离线单机体验 <i></i> VERSION 0.3</span></footer>
  </section>
  <section id="select" class="screen hidden"><div class="section-heading"><p class="eyebrow">THE JOURNEY</p><h2>选择一段旅程<span> / 关卡档案</span></h2><p>从第一道斜坡开始。</p></div><div id="level-list"></div><footer class="selection-footer"><span id="total-stars"></span><span>三章十八关 · 集齐 15 枚碎片开启倒映章</span></footer></section>
  <section id="play" class="screen hidden">
    <div class="hud"><button id="pause" class="icon-button" aria-label="暂停">Ⅱ</button><div class="hud-title"><span id="chapter-label"></span><h3 id="level-name"></h3></div><div class="hud-stats"><span id="goal-label">◉ 0 / 1</span><span id="timer">00:00</span><button id="reset" class="icon-button" aria-label="重新开始">↻</button></div></div>
    <div class="tutorial"><span id="step-num">01</span><div><small id="step-title">当前目标</small><p id="instruction"></p></div><button id="hint" aria-label="重看操作指引">?</button></div>
    <div id="lesson-progress" class="lesson-strip hidden" aria-label="教学进度" aria-live="polite"></div>
    <div class="tools"><button id="tool-move" class="active">↗ <span>摆放</span></button><button id="tool-board">▰ <span>木板</span><small id="boards">0</small></button><button id="tool-line">〰 <span>画线</span><small id="lines">0</small></button><button id="undo" aria-label="撤销">↶</button><button id="clear" aria-label="清理">⌫</button><button id="rotate-board" aria-label="旋转木板15度">⤾</button><label id="angle-wrap" class="hidden"><input id="board-angle" type="range" min="-60" max="60" step="1" value="0" aria-label="木板角度"><span id="angle-label">0°</span></label><div id="scale-tools" class="hidden"><button id="smaller" aria-label="缩小">−</button><span id="scale-label">1.00×</span><button id="larger" aria-label="放大">+</button></div></div>
    <div class="phase-controls"><span id="phase-label">准备 · 重力向下 ↓</span><button id="release" class="primary">释放 <span>▷</span></button><button id="prepare" class="secondary hidden">返回准备</button></div>
  </section>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modal-content"></div></div>
  <div id="chain-progress" class="hidden"></div><div id="debug-panel" class="hidden"></div><div id="toast" role="status"></div>
  <div id="rotate"><span>↻</span><h2>把世界横过来</h2><p>横屏，才能看见完整的空间。</p></div>
</main>
<script src="vendor/matter.min.js"></script><script src="js/physics.js"></script><script src="js/core.js"></script><script src="js/levels.js"></script><script src="js/runtime.js"></script><script src="js/session.js"></script><script src="js/platform.js"></script><script src="js/renderer.js"></script><script src="js/game.js"></script>
</body></html>
